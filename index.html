<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoidVault</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">V</div>
  <div>
    <b>VoidVault</b>
    <small>ALL TOOLS</small>
  </div>
</header>

<main>
  <div class="badge">● ONLINE TOOLBOX</div>

  <h1>Everything you need.<br><span>One vault.</span></h1>

  <p class="intro">Simple tools, fast utilities, all inside VoidVault.</p>

  <input id="search" class="search" placeholder="Search tools...">

  <h2>Tools</h2>

  <div class="grid">

    <button onclick="camera()">📷<b>Live Camera</b><small>Open your camera</small></button>

    <button onclick="counter()">📝<b>Word Counter</b><small>Count words</small></button>

    <button onclick="textCase()">Aa<b>Text Case</b><small>Change text case</small></button>

    <button onclick="jsonTool()">{}<b>JSON Formatter</b><small>Format JSON</small></button>

    <button onclick="password()">🔐<b>Password</b><small>Generate password</small></button>

    <button onclick="calculator()">＋<b>Calculator</b><small>Calculate anything</small></button>

  </div>
</main>

<div id="modal">
  <div id="box">
    <button onclick="closeTool()">×</button>
    <div id="content"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
