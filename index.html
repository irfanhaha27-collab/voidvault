<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoidVault // Live Camera</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="camera-app">

    <header class="topbar">
      <div>
        <span class="eyebrow">VOIDVAULT // CAMERA</span>
        <h1>Live Camera</h1>
        <p>Private camera workspace</p>
      </div>
    </header>

    <section class="camera-card">

      <div class="camera-frame">
        <video id="camera" autoplay playsinline muted></video>

        <div id="cameraPlaceholder" class="placeholder">
          <div class="camera-icon">◉</div>
          <h2>Camera Ready</h2>
          <p>Tekan tombol Start Camera untuk memulai.</p>
        </div>

        <div class="camera-status">
          <span id="statusDot"></span>
          <span id="statusText">OFFLINE</span>
        </div>
      </div>

      <div class="controls">

        <button id="startButton" class="primary">
          Start Camera
        </button>

        <button id="captureButton" disabled>
          Capture
        </button>

        <button id="switchButton" disabled>
          Switch Camera
        </button>

        <button id="stopButton" disabled>
          Stop
        </button>

      </div>

    </section>

    <section id="previewSection" class="preview-card hidden">

      <div class="section-title">
        <span class="eyebrow">CAPTURED IMAGE</span>
        <h2>Preview</h2>
      </div>

      <canvas id="canvas"></canvas>

      <div class="preview-buttons">

        <button id="retakeButton">
          Retake
        </button>

        <a id="downloadButton" class="primary download-button">
          Save Photo
        </a>

      </div>

    </section>

    <p id="message"></p>

  </main>

  <script src="script.js"></script>

</body>
</html>
